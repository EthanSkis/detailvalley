<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found | Detail Valley</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<!-- GitHub Pages serves this file for any missing URL, at any depth, so every
     link and asset path here must be absolute (start with /). -->
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="alternate icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f4f6f8; --surface:#ffffff; --rule:#dde3e9; --text:#0b2a45; --mute:#3d566b;
         --copper:#a4521f; --copper-hover:#8c4418; --ease:cubic-bezier(.22,1,.36,1) }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,.brand-word,.code{font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:500;letter-spacing:-.02em}
  a{color:var(--text)}
  a:hover{color:var(--copper)}
  :focus-visible{outline:3px solid var(--copper);outline-offset:3px}
  header{background:var(--surface);border-bottom:1px solid var(--rule);padding:16px 20px}
  header a{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  header img{width:40px;height:40px;display:block}
  .brand-word{font-size:1.1rem}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px 64px}
  .card{max-width:520px;width:100%;text-align:center}
  .code{font-size:.95rem;color:var(--copper);margin-bottom:12px}
  h1{font-size:2rem;line-height:1.15;margin-bottom:12px}
  p.lead{color:var(--mute);font-size:1.05rem;margin-bottom:28px}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:320px;margin:0 auto 32px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 28px;border-radius:8px;
    background:var(--copper);color:#fff;font-weight:500;font-size:1rem;text-decoration:none;transition:background-color .12s var(--ease)}
  .btn:hover{background:var(--copper-hover);color:#fff}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--rule)}
  .btn-ghost:hover{background:var(--surface);border-color:var(--text);color:var(--text)}
  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px;font-size:.94rem}
  .links a{padding:8px 0;color:var(--mute)}
  footer{border-top:1px solid var(--rule);background:var(--surface);padding:20px;text-align:center;font-size:.82rem;color:var(--mute)}
  @media(min-width:640px){ h1{font-size:2.5rem} .actions{flex-direction:row;max-width:none;justify-content:center} }
</style>
</head>
<body>
<header>
  <a href="/"><img src="/logo.svg" alt="" width="40" height="40"><span class="brand-word">Detail Valley</span></a>
</header>
<main>
  <div class="card">
    <p class="code">404</p>
    <h1>This page took a wrong turn</h1>
    <p class="lead">The page you're looking for doesn't exist or has moved. Your car can still get a detail, though.</p>
    <div class="actions">
      <a class="btn" href="/#packages">Book a detail</a>
      <a class="btn btn-ghost" href="/">Go to the homepage</a>
    </div>
    <nav class="links" aria-label="Popular pages">
      <a href="/before-after">Before &amp; after photos</a>
      <a href="/service-areas">Areas we serve</a>
      <a href="sms:+12083151420">Text (208) 315-1420</a>
    </nav>
  </div>
</main>
<footer>© 2026 Detail Valley · Valley County, ID · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></footer>
</body>
</html>
