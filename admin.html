<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0f10">
<meta name="color-scheme" content="dark">
<title>Detail Valley · Jobs</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" href="logo.png">
<style>
  /* Graphite ramp for every surface, three text roles, copper brand accent.
     Green / amber / red only where they carry a status. 4px spacing grid. */
  :root{
    --bg:#141415; --deep:#0f0f10; --card:#19191b; --card-2:#232325; --hover:#2b2b2e;
    --text:#ededed; --text-2:#a1a1a6; --text-3:#85858b;
    --sep:rgba(237,237,237,.08);
    --accent:#a4521f; --accent-hover:#8c4418; --accent-ink:#f0c29e;
    --green:#4cc38a; --amber:#e0a23a; --red:#e5484d;
    --ease:cubic-bezier(0.22,1,0.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-weight:500;letter-spacing:0}
  a{color:var(--accent-ink);text-decoration:none}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  /* One line-icon size and stroke everywhere; icons take the color of their label */
  .ico{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}

  /* Header: deepest surface with a hairline, 60px tall */
  header{background:var(--deep);padding:12px 0;box-shadow:inset 0 -1px 0 var(--sep);position:sticky;top:0;z-index:30}
  .head-row{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .brand img{width:36px;height:36px;border-radius:50%;display:block}
  .brand div{line-height:1.25}
  .brand b{font-weight:600;font-size:1rem}
  .brand span{display:block;font-size:.75rem;line-height:1.3333;color:var(--text-2)}
  .ghost{position:relative;background:var(--card-2);border:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--text);
    padding:8px 12px;border-radius:8px;font:inherit;font-size:.8125rem;line-height:1.5385;font-weight:500;cursor:pointer}

  main.wrap{padding-bottom:24px}

  /* Login */
  .card{background:var(--card);border:1px solid var(--sep);border-radius:16px;padding:19px}
  .login{max-width:420px;margin:24px auto}
  .login h2{font-size:1.25rem;line-height:1.4;margin-bottom:4px}
  .login p.sub{color:var(--text-2);font-size:.9375rem;margin-bottom:16px}
  label{display:block;font-size:.8125rem;font-weight:500;color:var(--text-2);margin:12px 0 8px}
  input{width:100%;padding:11px;border:1px solid var(--sep);border-radius:8px;
    font:inherit;font-size:1rem;color:var(--text);background:var(--card-2)}
  input::placeholder{color:var(--text-3)}
  input:focus{outline:none;border-color:var(--accent-ink)}
  .btn{display:block;width:100%;margin-top:16px;padding:12px 16px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;font:inherit;font-size:1rem;font-weight:500;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.alt{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--sep)}
  .linkbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:.875rem;
    font-weight:500;cursor:pointer;padding:12px 0;display:block;margin:4px auto 0}
  .note{font-size:.875rem;color:var(--text-2);text-align:center;margin-top:12px}
  /* Messages: quiet raised row, the status lives in a small dot */
  .msg{font-size:.875rem;line-height:1.4286;padding:12px;border-radius:8px;margin-top:12px;display:none;
    gap:8px;align-items:flex-start;background:var(--card-2);color:var(--text)}
  .msg.show{display:flex}
  .msg::before{content:'';flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--text-3)}
  .msg.ok::before{background:var(--green)}
  .msg.err::before{background:var(--red)}

  /* Summary */
  .summary{display:flex;gap:8px;margin:16px 0 12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--sep);border-radius:12px;padding:11px 7px;text-align:center}
  .stat b{display:block;font-size:1.5rem;font-weight:500;line-height:1.1667;color:var(--text);font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:.75rem;line-height:1.3333;color:var(--text-2)}

  /* View switch: segmented control, 44px tall, active = raised step with a top highlight */
  .viewswitch{display:flex;background:var(--deep);box-shadow:inset 0 0 0 1px var(--sep);border-radius:10px;
    padding:2px;gap:2px;margin-bottom:12px}
  .vw{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;border:none;
    border-radius:8px;background:transparent;font:inherit;font-size:.875rem;line-height:1.4286;font-weight:500;
    color:var(--text-2);cursor:pointer}
  .vw.on{background:var(--card-2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

  /* Calendar */
  .cal{padding:11px;margin-bottom:12px}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cal-title{flex:1;min-width:0}
  .cal-title b{font-size:1.125rem;font-weight:500;color:var(--text);display:block;line-height:1.3333}
  .cal-title span{display:block;font-size:.8125rem;line-height:1.2308;color:var(--text-2);font-variant-numeric:tabular-nums}
  .cal-nav{position:relative;flex:0 0 auto;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:8px;color:var(--text-2);cursor:pointer}
  .cal-today{position:relative;flex:0 0 auto;height:36px;padding:0 12px;border:none;background:var(--card-2);
    box-shadow:inset 0 0 0 1px var(--sep);border-radius:8px;font:inherit;font-size:.875rem;font-weight:500;
    color:var(--text);cursor:pointer}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.75rem;
    color:var(--text-3);padding-bottom:8px;border-bottom:1px solid var(--sep)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--sep)}
  .cal-cell{display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:88px;border:none;
    border-bottom:1px solid var(--sep);border-right:1px solid var(--sep);
    padding:4px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
  .cal-cell.out{cursor:default}
  .cal-cell.out .cal-num{color:var(--text-3);opacity:.6}
  .cal-cell.sel{background:var(--card-2)}
  .cal-cell.sel .cal-num{background:var(--text);color:var(--bg)}
  .cal-num{align-self:flex-start;font-size:.8125rem;font-weight:500;color:var(--text-2);width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-variant-numeric:tabular-nums}
  .cal-cell.today .cal-num{background:var(--accent);color:#fff}
  /* Day entries: quiet text with a status dot, no tinted pills */
  .cal-chip{display:block;font-size:.75rem;line-height:1.3333;color:var(--text);padding-left:2px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .cal-chip::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;
    vertical-align:1px;background:var(--text-3)}
  .c-pending::before{background:var(--amber)}
  .c-confirmed::before{background:var(--text)}
  .c-completed::before{background:var(--green)}
  .c-cancelled{color:var(--text-3);text-decoration:line-through}
  .c-cancelled::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-3)}
  .cal-more{display:block;font-size:.75rem;line-height:1.3333;color:var(--text-3);margin-top:2px;padding-left:2px}
  .cal-dots{display:none;flex-wrap:wrap;gap:4px;margin-top:4px;padding-left:2px}
  .cal-dots i,.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .d-pending{background:var(--amber)}
  .d-confirmed{background:var(--text)}
  .d-completed{background:var(--green)}
  .d-cancelled{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-3)}
  .cal-legend{display:flex;gap:16px;flex-wrap:wrap;padding-top:12px;font-size:.75rem;color:var(--text-2)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  @media(max-width:560px){
    .cal{padding:7px}
    .cal-cell{min-height:56px;padding:4px 2px}
    .cal-num{width:20px;height:20px;font-size:.75rem}
    .cal-chip,.cal-more{display:none}
    .cal-dots{display:flex}
  }

  /* Filters: 36px rows with a 44px tap area; the selected one is the off-white fill */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:-4px 0 4px;-webkit-overflow-scrolling:touch}
  .chip{position:relative;flex:0 0 auto;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);border:none;color:var(--text-2);
    padding:8px 12px;border-radius:8px;font:inherit;font-size:.875rem;line-height:1.4286;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--text);color:var(--bg);box-shadow:none}
  .chip i{font-style:normal;font-weight:400;color:var(--text-3);font-variant-numeric:tabular-nums}
  .chip.on i{color:#55555a}

  /* Day groups + cards */
  .day-h{font-weight:500;font-size:.9375rem;color:var(--text);
    margin:20px 4px 8px;display:flex;align-items:center;gap:8px}
  .day-h:first-child{margin-top:4px}
  .day-h em{font-style:normal;color:var(--text-2);font-weight:400;font-size:.8125rem;font-variant-numeric:tabular-nums}
  .job{background:var(--card);border:1px solid var(--sep);border-radius:16px;padding:15px;margin-bottom:12px}
  .job-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
  .time{min-width:76px;font-weight:500;font-size:1rem;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
  .who{flex:1;min-width:0}
  .who b{font-weight:500;font-size:1rem;display:block}
  .who a.tel{position:relative;font-size:.9375rem;font-variant-numeric:tabular-nums}
  /* Status: quiet text with a dot instead of a tinted pill */
  .badge{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;line-height:1.8462;
    color:var(--text-2);text-transform:capitalize}
  .badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--text-3)}
  .b-pending::before{background:var(--amber)}
  .b-confirmed::before{background:var(--text)}
  .b-completed::before{background:var(--green)}
  .b-cancelled::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-3)}
  .meta{font-size:.9375rem;color:var(--text)}
  .meta.addons{color:var(--text-2)}
  .total{font-weight:500;color:var(--text);font-size:1rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .addr{position:relative;display:inline-flex;align-items:flex-start;gap:8px;font-size:.9375rem;line-height:1.6;
    margin-top:4px}
  .addr .ico{margin-top:4px}
  .warn{background:var(--card-2);color:var(--amber);font-size:.875rem;line-height:1.4286;
    padding:8px 12px;border-radius:8px;margin-top:8px;font-weight:500}
  textarea.notes{display:block;width:100%;margin-top:12px;padding:11px;border:1px solid var(--sep);
    border-radius:8px;font:inherit;font-size:.875rem;line-height:1.4286;color:var(--text);resize:vertical;
    min-height:44px;background:var(--card-2)}
  textarea.notes::placeholder{color:var(--text-3)}
  textarea.notes:focus{outline:none;border-color:var(--accent-ink)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .act{flex:1 1 auto;min-width:120px;padding:12px;border:none;border-radius:8px;font:inherit;
    font-size:.875rem;line-height:1.4286;font-weight:500;cursor:pointer}
  .act-pri{background:var(--accent);color:#fff}
  .act-blue{background:var(--card-2);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--sep)}
  .act-ghost{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--sep)}
  .act:disabled{opacity:.5;cursor:default}
  .empty{text-align:center;color:var(--text-2);padding:40px 16px;font-size:.9375rem}
  .meta-foot{font-size:.75rem;color:var(--text-3);margin-top:8px;font-variant-numeric:tabular-nums}

  /* Account / password */
  .acct{margin-top:24px;background:var(--card);border:1px solid var(--sep);border-radius:16px;padding:0 15px}
  .acct[open]{padding-bottom:15px}
  .acct summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;color:var(--text-2);
    font-size:.875rem;line-height:1.4286;padding:12px 0;list-style:none}
  .acct summary::-webkit-details-marker{display:none}
  .acct summary .ico{color:var(--text-3)}
  .acct[open] summary .ico{transform:rotate(90deg)}
  .acct label{margin-top:4px}
  .acct .note{text-align:left}

  /* Invisible tap-area extensions so the compact controls and text links still give 44px to a thumb */
  .ghost::after,.chip::after{content:'';position:absolute;inset:-4px 0}
  .vw{position:relative}
  .vw::after{content:'';position:absolute;inset:-2px -1px}
  .cal-nav::after,.cal-today::after{content:'';position:absolute;inset:-4px}
  .who a.tel::after,.addr::after{content:'';position:absolute;inset:-12px -8px}

  /* Toast: raised surface with a hairline and a neutral shadow */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
    background:var(--card-2);color:var(--text);padding:12px 16px;border-radius:8px;font-size:.875rem;
    line-height:1.4286;font-weight:500;box-shadow:inset 0 0 0 1px var(--sep),0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease);
    z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* States: one easing, named properties, hover only where there is a pointer */
  .ghost,.btn,.vw,.chip,.act,.cal-nav,.cal-today,.cal-cell{
    transition:background-color 150ms var(--ease),color 150ms var(--ease),transform 150ms var(--ease)}
  input,textarea.notes{transition:border-color 150ms var(--ease)}
  .btn:enabled:active,.act:enabled:active{transform:scale(.98)}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
  @media(hover:hover){
    .btn:enabled:hover,.act-pri:enabled:hover{background:var(--accent-hover)}
    .ghost:hover,.btn.alt:enabled:hover,.act-ghost:enabled:hover,.act-blue:enabled:hover,.cal-today:hover{background:var(--hover)}
    .cal-nav:hover{background:var(--card-2);color:var(--text)}
    .cal-cell:hover:not(.out):not(.sel){background:rgba(237,237,237,.04)}
    .vw:hover:not(.on),.chip:hover:not(.on){color:var(--text)}
    a:hover,.linkbtn:hover{text-decoration:underline}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div class="brand">
      <img src="logo.svg" alt="Detail Valley">
      <div><b>Detail Valley</b><span>Job board</span></div>
    </div>
    <button class="ghost" id="signout" hidden onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="wrap">
  <!-- Login -->
  <section id="login" class="card login" hidden>
    <h2>Owner sign-in</h2>
    <p class="sub">Private dashboard for managing Detail Valley bookings</p>
    <label for="email">Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="you@detailvalley.com">

    <div id="pwPane">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <button class="btn" id="pwSignin" onclick="passwordSignIn()">Sign in</button>
      <button class="linkbtn" onclick="togglePw(false)">Email me a sign-in link instead</button>
    </div>

    <div id="linkPane" hidden>
      <button class="btn" id="sendLink" onclick="sendLink()">Email me a sign-in link</button>
      <button class="linkbtn" onclick="togglePw(true)">Use a password instead</button>
    </div>

    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- Board -->
  <section id="board" hidden>
    <div class="summary" id="summary"></div>

    <div class="viewswitch">
      <button id="vw-list" class="vw on" onclick="setView('list')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button>
      <button id="vw-cal" class="vw" onclick="setView('cal')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Calendar</button>
    </div>

    <div class="filters" id="filters"></div>
    <div id="jobs"></div>

    <!-- Calendar view -->
    <div id="calendar" hidden>
      <div class="card cal">
        <div class="cal-head">
          <button class="cal-nav" onclick="calShift(-1)" aria-label="Previous month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="cal-title"><b id="calTitle"></b><span id="calSub"></span></div>
          <button class="cal-nav" onclick="calShift(1)" aria-label="Next month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="cal-today" onclick="calToday()">Today</button>
        </div>
        <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><i class="d-pending"></i>New</span>
          <span><i class="d-confirmed"></i>Confirmed</span>
          <span><i class="d-completed"></i>Done</span>
          <span><i class="d-cancelled"></i>Cancelled</span>
        </div>
      </div>
      <div id="calDay"></div>
    </div>

    <details class="acct">
      <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>Account &amp; password</summary>
      <label for="newpw">Set a new password</label>
      <input id="newpw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <button class="btn alt" onclick="changePassword()">Save password</button>
      <p class="note">On iPhone, tap “Save Password” when prompted. Next time you can sign in with Face ID.</p>
      <div class="msg" id="acctMsg"></div>
    </details>
  </section>

  <p class="empty" id="boot">Loading…</p>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Supabase (same project + publishable key as the site) ---------- */
const SUPABASE_URL = 'https://utybbdrthxgsijplowup.supabase.co';
const SUPABASE_KEY = 'sb_publishable_48352eB1w0mLVwvLm3gXUg_BpGKN67o';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const TZ = 'America/Boise';   // Valley County, Idaho — Mountain Time

const $ = id => document.getElementById(id);
let JOBS = [];
let FILTER = 'todo';
let VIEW = 'list';      // 'list' | 'cal'
let CAL_REF = null;     // {y, m} — month shown in the calendar
let CAL_SEL = null;     // 'YYYY-MM-DD' — selected day

/* ---------- Helpers ---------- */
const dayFmt  = new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ});
const timeFmt = new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ});
const dateKeyFmt = new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:TZ});
const shortDate = new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:TZ});
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = iso => dateKeyFmt.format(new Date(iso));
const todayKey = () => dateKeyFmt.format(new Date());

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function loginMsg(text, kind){
  const m = $('loginMsg'); m.textContent = text;
  m.className = 'msg show ' + (kind || 'ok');
}

/* ---------- Auth flow ---------- */
async function boot(){
  if(!sb){ $('boot').textContent = 'Could not load Supabase. Check your connection and refresh.'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  // React to login link returns + sign in/out.
  sb.auth.onAuthStateChange((_e, s)=>render(s));
  render(session);
}

async function render(session){
  $('boot').hidden = true;
  if(!session){
    $('signout').hidden = true;
    $('board').hidden = true;
    $('login').hidden = false;
    return;
  }
  // Confirm this account is actually an admin (RLS-backed).
  const { data:isAdmin, error } = await sb.rpc('is_admin');
  if(error || !isAdmin){
    $('login').hidden = false; $('board').hidden = true; $('signout').hidden = false;
    loginMsg('This account isn’t set up as an owner. Sign out and use your owner email, or ask to be added.', 'err');
    return;
  }
  $('login').hidden = true;
  $('board').hidden = false;
  $('signout').hidden = false;
  loadJobs();
}

function togglePw(showPw){
  $('linkPane').hidden = showPw;
  $('pwPane').hidden = !showPw;
}

async function sendLink(){
  const email = $('email').value.trim();
  if(!email){ loginMsg('Enter your email first', 'err'); return; }
  const btn = $('sendLink'); btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({
    email,
    options:{ shouldCreateUser:false, emailRedirectTo: location.origin + location.pathname }
  });
  btn.disabled = false; btn.textContent = 'Email me a sign-in link';
  if(error){ loginMsg(error.message, 'err'); return; }
  loginMsg('Check your email and tap the sign-in link. Open it on this device to finish.', 'ok');
}

async function passwordSignIn(){
  const email = $('email').value.trim();
  const password = $('pw').value;
  if(!email || !password){ loginMsg('Enter your email and password', 'err'); return; }
  const btn = $('pwSignin'); btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ loginMsg(error.message, 'err'); return; }
}

async function signOut(){ await sb.auth.signOut(); }

function acctMsg(text, kind){
  const m = $('acctMsg'); m.textContent = text; m.className = 'msg show ' + (kind || 'ok');
}
async function changePassword(){
  const pw = $('newpw').value;
  if(pw.length < 8){ acctMsg('Use at least 8 characters', 'err'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){ acctMsg(error.message, 'err'); return; }
  $('newpw').value = '';
  acctMsg('Password updated. Save it to your iPhone Keychain when prompted.', 'ok');
}

/* ---------- Jobs ---------- */
async function loadJobs(){
  $('jobs').innerHTML = '<p class="empty">Loading jobs…</p>';
  const { data, error } = await sb.from('bookings').select('*').order('slot_start',{ascending:true});
  if(error){ $('jobs').innerHTML = '<p class="empty">Couldn’t load jobs: '+esc(error.message)+'</p>'; return; }
  JOBS = data || [];
  redraw();
}

/* Repaint whichever view is active (plus the shared summary + filter counts). */
function redraw(){
  drawSummary();
  drawFilters();
  if(VIEW==='cal') drawCalendar(); else drawJobs();
}

function setView(v){
  VIEW = v;
  $('vw-list').classList.toggle('on', v==='list');
  $('vw-cal').classList.toggle('on', v==='cal');
  $('filters').hidden = v!=='list';
  $('jobs').hidden = v!=='list';
  $('calendar').hidden = v!=='cal';
  // Only one view renders job cards at a time so element ids stay unique.
  if(v==='list'){ $('calDay').innerHTML=''; drawJobs(); }
  else { $('jobs').innerHTML=''; drawCalendar(); }
}

const FILTERS = [
  { id:'todo',      label:'To do',     match:j => (j.status==='pending'||j.status==='confirmed') },
  { id:'pending',   label:'New',       match:j => j.status==='pending' },
  { id:'confirmed', label:'Confirmed', match:j => j.status==='confirmed' },
  { id:'completed', label:'Done',      match:j => j.status==='completed' },
  { id:'cancelled', label:'Cancelled', match:j => j.status==='cancelled' },
  { id:'all',       label:'All',       match:_ => true },
];

function drawSummary(){
  const tk = todayKey();
  const newCount = JOBS.filter(j=>j.status==='pending').length;
  const upcoming = JOBS.filter(j=>j.status==='confirmed' && dayKey(j.slot_start)>=tk);
  const booked = upcoming.reduce((s,j)=>s+(j.total_usd||0),0);
  $('summary').innerHTML =
    `<div class="stat"><b>${newCount}</b><span>New</span></div>`+
    `<div class="stat"><b>${upcoming.length}</b><span>Upcoming</span></div>`+
    `<div class="stat"><b>$${booked}</b><span>Booked</span></div>`;
}

function drawFilters(){
  $('filters').innerHTML = FILTERS.map(f=>{
    const n = JOBS.filter(f.match).length;
    return `<button class="chip ${FILTER===f.id?'on':''}" onclick="setFilter('${f.id}')">`+
           `${f.label} <i>${n}</i></button>`;
  }).join('');
}

function setFilter(id){ FILTER = id; drawFilters(); drawJobs(); }

function drawJobs(){
  const f = FILTERS.find(x=>x.id===FILTER);
  let list = JOBS.filter(f.match);
  // "To do" reads best soonest-first; history reads best newest-first.
  if(FILTER==='completed' || FILTER==='cancelled') list = list.slice().reverse();

  if(!list.length){ $('jobs').innerHTML = '<p class="empty">Nothing here right now</p>'; return; }

  const tk = todayKey();
  let html = '', lastDay = '';
  for(const j of list){
    const dk = dayKey(j.slot_start);
    if(dk !== lastDay){
      lastDay = dk;
      let tag = '';
      if(dk===tk) tag = '<em>Today</em>';
      else if(dk < tk) tag = '<em>Past</em>';
      html += `<div class="day-h">${dayFmt.format(new Date(j.slot_start))} ${tag}</div>`;
    }
    html += jobCard(j);
  }
  $('jobs').innerHTML = html;
}

/* Ordinal day number: 9 -> "9th", 21 -> "21st", 12 -> "12th". */
const nth = d => { const t = d%100, r = d%10;
  return d + (t>=11 && t<=13 ? 'th' : r===1 ? 'st' : r===2 ? 'nd' : r===3 ? 'rd' : 'th'); };

/* Prefilled confirmation text for the tap-to-text link:
   "Hey Jhen, confirming your July 9th booking at 9am. See you then!" */
function confirmText(j){
  const first = (j.customer_name||'').trim().split(/\s+/)[0];
  const [, m, d] = dayKey(j.slot_start).split('-').map(Number);
  return `Hey ${first}, confirming your ${MONTHS[m-1]} ${nth(d)} booking at ${chipTime(j.slot_start)}. See you then!`;
}

function jobCard(j){
  const addons = (j.addons && j.addons.length) ? `<p class="meta addons">+ ${esc(j.addons.join(', '))}</p>` : '';
  const mapQ = encodeURIComponent(`${j.address}, ${j.town}, Idaho`);
  const phoneDigits = (j.customer_phone||'').replace(/[^\d+]/g,'');
  // "?&body=" is deliberate — iOS Messages wants "&body=", Android wants
  // "?body="; the combined form opens with the draft filled in on both.
  const smsHref = `sms:${phoneDigits}?&body=${encodeURIComponent(confirmText(j))}`;
  // The booking form folds a water/power warning into the package text.
  const warn = /Water\/power/i.test(j.package)
    ? `<div class="warn">${esc(j.package.split('·').pop().trim())}</div>` : '';
  const pkg = esc(j.package.replace(/·\s*⚠[^·]*$/,'').trim());
  const booked = shortDate.format(new Date(j.created_at));

  let actions = '';
  if(j.status==='pending')
    actions = `<button class="act act-pri" onclick="setStatus('${j.id}','confirmed')">Confirm</button>`+
              `<button class="act act-ghost" onclick="setStatus('${j.id}','cancelled')">Cancel</button>`;
  else if(j.status==='confirmed')
    actions = `<button class="act act-pri" onclick="setStatus('${j.id}','completed')">Mark done</button>`+
              `<button class="act act-ghost" onclick="setStatus('${j.id}','cancelled')">Cancel</button>`;
  else if(j.status==='completed')
    actions = `<button class="act act-ghost" onclick="setStatus('${j.id}','confirmed')">Reopen</button>`;
  else if(j.status==='cancelled')
    actions = `<button class="act act-blue" onclick="setStatus('${j.id}','pending')">Restore</button>`;

  return `<div class="job" id="job-${j.id}">
    <div class="job-top">
      <div class="time">${timeFmt.format(new Date(j.slot_start))}</div>
      <div class="who">
        <b>${esc(j.customer_name)}</b>
        <a class="tel" href="${esc(smsHref)}">${esc(j.customer_phone)}</a>
      </div>
      <span class="badge b-${j.status}">${j.status}</span>
    </div>
    <p class="meta">${pkg}</p>
    ${addons}
    <p class="total">$${j.total_usd}</p>
    <a class="addr" href="https://maps.google.com/?q=${mapQ}" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>${esc(j.address)}, ${esc(j.town)}</a>
    ${warn}
    <textarea class="notes" placeholder="Notes (gate code, dog, reminders)"
      data-id="${j.id}" onblur="saveNotes(this)">${esc(j.notes)}</textarea>
    <div class="actions">${actions}</div>
    <div class="meta-foot">Booked ${booked}</div>
  </div>`;
}

/* ---------- Calendar view ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad2 = n => String(n).padStart(2,'0');
/* Compact chip time: "9:00 AM" -> "9am", "1:30 PM" -> "1:30pm". */
const chipTime = iso => timeFmt.format(new Date(iso)).replace(':00','').replace(' AM','am').replace(' PM','pm');

function calInit(){
  if(CAL_REF) return;
  const [y,m] = todayKey().split('-').map(Number);
  CAL_REF = { y, m: m-1 };
  CAL_SEL = todayKey();
}
function calShift(n){
  calInit();
  let m = CAL_REF.m + n, y = CAL_REF.y;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  CAL_REF = { y, m };
  drawCalendar();
}
function calToday(){
  const [y,m] = todayKey().split('-').map(Number);
  CAL_REF = { y, m: m-1 };
  CAL_SEL = todayKey();
  drawCalendar();
}
function calSelect(k){ CAL_SEL = k; drawCalendar(); }

function drawCalendar(){
  calInit();
  const { y, m } = CAL_REF;

  // Jobs grouped by their (Mountain Time) calendar day. JOBS is already time-sorted.
  const byDay = {};
  for(const j of JOBS){ const k = dayKey(j.slot_start); (byDay[k] = byDay[k] || []).push(j); }

  // Month headline: live job count + booked revenue (cancelled excluded).
  const mPrefix = `${y}-${pad2(m+1)}-`;
  const mJobs = JOBS.filter(j => dayKey(j.slot_start).startsWith(mPrefix) && j.status!=='cancelled');
  const mRev = mJobs.reduce((s,j)=>s+(j.total_usd||0),0);
  $('calTitle').textContent = `${MONTHS[m]} ${y}`;
  $('calSub').textContent = mJobs.length ? `${mJobs.length} job${mJobs.length===1?'':'s'} · $${mRev}` : 'No jobs this month';

  const startDow = new Date(y, m, 1).getDay();
  const daysIn = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const tk = todayKey();
  const totalCells = Math.ceil((startDow + daysIn) / 7) * 7;
  const MAXCHIP = 3;

  let cells = '';
  for(let i=0; i<totalCells; i++){
    const dnum = i - startDow + 1;
    if(dnum < 1 || dnum > daysIn){
      const shown = dnum < 1 ? daysInPrev + dnum : dnum - daysIn;
      cells += `<div class="cal-cell out"><span class="cal-num">${shown}</span></div>`;
      continue;
    }
    const k = `${y}-${pad2(m+1)}-${pad2(dnum)}`;
    const js = byDay[k] || [];
    const chips = js.slice(0, MAXCHIP).map(j =>
      `<span class="cal-chip c-${j.status}">${chipTime(j.slot_start)} ${esc((j.customer_name||'').split(' ')[0])}</span>`
    ).join('') + (js.length > MAXCHIP ? `<span class="cal-more">+${js.length-MAXCHIP} more</span>` : '');
    const dots = js.length ? `<span class="cal-dots">${js.map(j=>`<i class="d-${j.status}"></i>`).join('')}</span>` : '';
    cells += `<button class="cal-cell${k===tk?' today':''}${k===CAL_SEL?' sel':''}" onclick="calSelect('${k}')">`+
             `<span class="cal-num">${dnum}</span>${chips}${dots}</button>`;
  }
  $('calGrid').innerHTML = cells;
  drawCalDay(byDay);
}

/* Full job cards (same as the list view) for the selected day, under the grid. */
function drawCalDay(byDay){
  const el = $('calDay');
  if(!CAL_SEL){ el.innerHTML = ''; return; }
  const [yy,mm,dd] = CAL_SEL.split('-').map(Number);
  const label = new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date(yy, mm-1, dd));
  const tag = CAL_SEL===todayKey() ? '<em>Today</em>' : '';
  const js = byDay[CAL_SEL] || [];
  if(!js.length){
    el.innerHTML = `<div class="day-h">${label} ${tag}</div><p class="empty" style="padding:16px">No jobs this day</p>`;
    return;
  }
  const rev = js.filter(j=>j.status!=='cancelled').reduce((s,j)=>s+(j.total_usd||0),0);
  el.innerHTML = `<div class="day-h">${label} ${tag}<em style="margin-left:auto">$${rev}</em></div>` + js.map(jobCard).join('');
}

async function setStatus(id, status){
  const card = $('job-'+id);
  if(card) card.querySelectorAll('.act').forEach(b=>b.disabled=true);
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if(error){ toast('Update failed: '+error.message); if(card) card.querySelectorAll('.act').forEach(b=>b.disabled=false); return; }
  const j = JOBS.find(x=>x.id===id); if(j) j.status = status;
  toast(status==='confirmed'?'Confirmed':status==='completed'?'Marked done':status==='cancelled'?'Cancelled':'Updated');
  redraw();
}

async function saveNotes(el){
  const id = el.dataset.id;
  const j = JOBS.find(x=>x.id===id);
  const val = el.value;
  if(!j || j.notes === val) return;
  const { error } = await sb.from('bookings').update({ notes: val }).eq('id', id);
  if(error){ toast('Couldn’t save note'); return; }
  j.notes = val; toast('Note saved');
}

boot();
</script>
