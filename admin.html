<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Detail Valley — Jobs</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" href="logo.png">
<style>
  /* Apple dark-mode palette — iOS/macOS system colors + elevated surfaces */
  :root{
    --bg:#000; --card:#1c1c1e; --card-2:#2c2c2e; --fill:#3a3a3c;
    --text:#fff; --text-2:rgba(235,235,245,.6); --text-3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --grid:rgba(84,84,88,.45);
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --gray:#8e8e93;
    --blue-tint:rgba(10,132,255,.16); --green-tint:rgba(48,209,88,.16);
    --orange-tint:rgba(255,159,10,.16); --red-tint:rgba(255,69,58,.16);
    --gray-tint:rgba(120,120,128,.24);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-weight:700;letter-spacing:-.02em}
  a{color:var(--blue);text-decoration:none}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  /* Header — translucent blurred bar, iOS style */
  header{background:rgba(28,28,30,.9);backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);padding:13px 0;
    border-bottom:.5px solid var(--sep);position:sticky;top:0;z-index:30}
  .head-row{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand img{width:36px;height:36px;border-radius:50%;display:block}
  .brand b{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
  .brand span{display:block;font-size:.72rem;color:var(--text-2);font-weight:500}
  .ghost{background:var(--gray-tint);border:none;color:var(--text);
    padding:7px 14px;border-radius:999px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
  .ghost:hover{background:var(--fill)}

  main{padding:18px 0 60px}

  /* Login */
  .card{background:var(--card);border:none;border-radius:16px;padding:22px}
  .login{max-width:420px;margin:24px auto}
  .login h2{font-size:1.3rem;margin-bottom:6px}
  .login p.sub{color:var(--text-2);font-size:.92rem;margin-bottom:18px}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;border:1px solid transparent;border-radius:10px;
    font:inherit;font-size:1rem;color:var(--text);background:var(--card-2)}
  input::placeholder{color:var(--text-3)}
  input:focus{outline:none;border-color:var(--blue)}
  .btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:var(--blue);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.alt{background:var(--blue-tint);color:var(--blue)}
  .btn.alt:hover{background:rgba(10,132,255,.26);filter:none}
  .linkbtn{background:none;border:none;color:var(--blue);font:inherit;font-size:.86rem;
    font-weight:600;cursor:pointer;padding:10px 0;display:block;margin:6px auto 0}
  .note{font-size:.86rem;color:var(--text-2);text-align:center;margin-top:14px}
  .msg{font-size:.88rem;padding:11px 13px;border-radius:10px;margin-top:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--green-tint);color:var(--green)}
  .msg.err{background:var(--red-tint);color:var(--red)}

  /* Summary */
  .summary{display:flex;gap:10px;margin-top:18px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:none;border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--text)}
  .stat span{font-size:.7rem;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

  /* View switch — iOS segmented control */
  .viewswitch{display:flex;background:var(--gray-tint);border-radius:9px;padding:2px;gap:2px;margin-bottom:12px}
  .vw{flex:1;padding:8px;border:none;border-radius:7px;background:transparent;font:inherit;
    font-size:.88rem;font-weight:600;color:var(--text);cursor:pointer}
  .vw.on{background:#636366;box-shadow:0 2px 6px rgba(0,0,0,.35)}

  /* Calendar */
  .cal{padding:14px 14px 12px;margin-bottom:14px}
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .cal-title{flex:1;min-width:0}
  .cal-title b{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;color:var(--text);display:block;line-height:1.2}
  .cal-title span{display:block;font-size:.78rem;color:var(--text-2);font-weight:500}
  .cal-nav{flex:0 0 auto;width:36px;height:36px;border:none;background:transparent;border-radius:9px;
    font-size:1.5rem;line-height:1;color:var(--red);cursor:pointer;font-weight:500;padding-bottom:3px}
  .cal-nav:hover{background:rgba(255,255,255,.06)}
  .cal-today{flex:0 0 auto;height:36px;padding:0 12px;border:none;background:transparent;
    border-radius:9px;font:inherit;font-size:.9rem;font-weight:600;color:var(--red);cursor:pointer}
  .cal-today:hover{background:rgba(255,255,255,.06)}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.68rem;font-weight:700;
    color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:1px solid var(--grid)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--grid)}
  .cal-cell{min-height:86px;border:none;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);
    padding:4px;background:transparent;font:inherit;text-align:left;vertical-align:top;cursor:pointer;overflow:hidden}
  .cal-cell:hover:not(.out){background:rgba(255,255,255,.04)}
  .cal-cell.out{cursor:default}
  .cal-cell.out .cal-num{color:var(--text-3)}
  .cal-cell.sel{background:rgba(255,255,255,.07)}
  .cal-cell.sel .cal-num{background:#fff;color:#000}
  .cal-num{font-size:.8rem;font-weight:600;color:var(--text-2);width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-cell.today .cal-num{background:var(--red);color:#fff}
  .cal-chip{display:block;font-size:.68rem;font-weight:600;border-radius:4px;padding:2px 5px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-pending{background:var(--orange-tint);color:var(--orange)}
  .c-confirmed{background:var(--blue-tint);color:var(--blue)}
  .c-completed{background:var(--green-tint);color:var(--green)}
  .c-cancelled{background:var(--gray-tint);color:var(--gray);text-decoration:line-through;opacity:.8}
  .cal-more{display:block;font-size:.66rem;color:var(--text-2);font-weight:600;margin-top:2px;padding-left:2px}
  .cal-dots{display:none;flex-wrap:wrap;gap:3px;margin-top:3px;padding-left:2px}
  .cal-dots i,.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .d-pending{background:var(--orange)}
  .d-confirmed{background:var(--blue)}
  .d-completed{background:var(--green)}
  .d-cancelled{background:var(--gray)}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;padding-top:10px;font-size:.72rem;font-weight:600;color:var(--text-2)}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  @media(max-width:560px){
    .cal{padding:10px 8px 10px}
    .cal-cell{min-height:58px;padding:3px 2px}
    .cal-num{width:20px;height:20px;font-size:.72rem}
    .cal-chip,.cal-more{display:none}
    .cal-dots{display:flex}
  }

  /* Filters */
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;background:var(--card);border:none;color:var(--text-2);
    padding:8px 14px;border-radius:999px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:#fff;color:#000}
  .chip i{font-style:normal;opacity:.6;font-weight:600}

  /* Day groups + cards */
  .day-h{font-weight:600;font-size:.95rem;color:var(--text);
    margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
  .day-h:first-child{margin-top:6px}
  .day-h em{font-style:normal;color:var(--text-2);font-weight:500;font-size:.82rem}
  .job{background:var(--card);border:none;border-radius:16px;padding:16px;margin-bottom:12px}
  .job-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .time{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
  .who{flex:1;min-width:0}
  .who b{font-weight:600;font-size:1rem;display:block}
  .who a.tel{font-size:.9rem;font-weight:600}
  .badge{flex:0 0 auto;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:4px 9px;border-radius:7px}
  .b-pending{background:var(--orange-tint);color:var(--orange)}
  .b-confirmed{background:var(--blue-tint);color:var(--blue)}
  .b-completed{background:var(--green-tint);color:var(--green)}
  .b-cancelled{background:var(--gray-tint);color:var(--gray)}
  .meta{font-size:.9rem;color:var(--text);margin:2px 0}
  .meta.addons{color:var(--text-2)}
  .total{font-weight:700;color:var(--green);font-size:1.05rem;letter-spacing:-.01em;margin-top:4px}
  .addr{display:inline-flex;align-items:center;gap:5px;font-size:.9rem;font-weight:600;margin-top:6px}
  .warn{background:var(--orange-tint);border:none;color:var(--orange);font-size:.84rem;
    padding:7px 10px;border-radius:8px;margin-top:8px;font-weight:600}
  textarea.notes{width:100%;margin-top:10px;padding:10px 12px;border:1px solid transparent;
    border-radius:10px;font:inherit;font-size:.9rem;color:var(--text);resize:vertical;min-height:42px;background:var(--card-2)}
  textarea.notes::placeholder{color:var(--text-3)}
  textarea.notes:focus{outline:none;border-color:var(--blue)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .act{flex:1 1 auto;min-width:120px;padding:11px;border:none;border-radius:10px;font:inherit;
    font-size:.9rem;font-weight:600;cursor:pointer}
  .act-pri{background:var(--green-tint);color:var(--green)}
  .act-pri:hover{background:rgba(48,209,88,.26)}
  .act-blue{background:var(--blue-tint);color:var(--blue)}
  .act-blue:hover{background:rgba(10,132,255,.26)}
  .act-ghost{background:var(--gray-tint);border:none;color:var(--text-2)}
  .act-ghost:hover{background:var(--fill)}
  .act:disabled{opacity:.5;cursor:default}
  .empty{text-align:center;color:var(--text-2);padding:40px 16px;font-size:.95rem}
  .meta-foot{font-size:.76rem;color:var(--text-3);margin-top:10px}

  /* Account / password */
  .acct{margin-top:24px;background:var(--card);border:none;border-radius:14px;padding:4px 16px 16px}
  .acct summary{cursor:pointer;font-weight:600;color:var(--text-2);font-size:.92rem;padding:12px 0;list-style:none}
  .acct summary::-webkit-details-marker{display:none}
  .acct summary::before{content:'⚙ ';opacity:.7}
  .acct .note{text-align:left;margin-top:10px}
  .acct .msg{margin-bottom:6px}

  /* Toast — elevated dark surface */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--fill);color:#fff;padding:11px 18px;border-radius:12px;font-size:.9rem;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div class="brand">
      <img src="logo.svg" alt="Detail Valley">
      <div><b>Detail Valley</b><span>Job board</span></div>
    </div>
    <button class="ghost" id="signout" hidden onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="wrap">
  <!-- Login -->
  <section id="login" class="card login" hidden>
    <h2>Owner sign-in</h2>
    <p class="sub">Private dashboard for managing Detail Valley bookings.</p>
    <label for="email">Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="you@detailvalley.com">

    <div id="pwPane">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Your password">
      <button class="btn" id="pwSignin" onclick="passwordSignIn()">Sign in</button>
      <button class="linkbtn" onclick="togglePw(false)">Email me a sign-in link instead</button>
    </div>

    <div id="linkPane" hidden>
      <button class="btn" id="sendLink" onclick="sendLink()">Email me a sign-in link</button>
      <button class="linkbtn" onclick="togglePw(true)">Use a password instead</button>
    </div>

    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- Board -->
  <section id="board" hidden>
    <div class="summary" id="summary"></div>

    <div class="viewswitch">
      <button id="vw-list" class="vw on" onclick="setView('list')">☰ List</button>
      <button id="vw-cal" class="vw" onclick="setView('cal')">▦ Calendar</button>
    </div>

    <div class="filters" id="filters"></div>
    <div id="jobs"></div>

    <!-- Calendar view -->
    <div id="calendar" hidden>
      <div class="card cal">
        <div class="cal-head">
          <button class="cal-nav" onclick="calShift(-1)" aria-label="Previous month">‹</button>
          <div class="cal-title"><b id="calTitle"></b><span id="calSub"></span></div>
          <button class="cal-nav" onclick="calShift(1)" aria-label="Next month">›</button>
          <button class="cal-today" onclick="calToday()">Today</button>
        </div>
        <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><i class="d-pending"></i>New</span>
          <span><i class="d-confirmed"></i>Confirmed</span>
          <span><i class="d-completed"></i>Done</span>
          <span><i class="d-cancelled"></i>Cancelled</span>
        </div>
      </div>
      <div id="calDay"></div>
    </div>

    <details class="acct">
      <summary>Account &amp; password</summary>
      <label for="newpw">Set a new password</label>
      <input id="newpw" type="password" autocomplete="new-password" placeholder="New password (8+ characters)">
      <button class="btn alt" onclick="changePassword()">Save password</button>
      <p class="note">On iPhone, tap “Save Password” when prompted — next time you can sign in with Face ID.</p>
      <div class="msg" id="acctMsg"></div>
    </details>
  </section>

  <p class="empty" id="boot">Loading…</p>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Supabase (same project + publishable key as the site) ---------- */
const SUPABASE_URL = 'https://utybbdrthxgsijplowup.supabase.co';
const SUPABASE_KEY = 'sb_publishable_48352eB1w0mLVwvLm3gXUg_BpGKN67o';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const TZ = 'America/Boise';   // Valley County, Idaho — Mountain Time

const $ = id => document.getElementById(id);
let JOBS = [];
let FILTER = 'todo';
let VIEW = 'list';      // 'list' | 'cal'
let CAL_REF = null;     // {y, m} — month shown in the calendar
let CAL_SEL = null;     // 'YYYY-MM-DD' — selected day

/* ---------- Helpers ---------- */
const dayFmt  = new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ});
const timeFmt = new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ});
const dateKeyFmt = new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:TZ});
const shortDate = new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:TZ});
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = iso => dateKeyFmt.format(new Date(iso));
const todayKey = () => dateKeyFmt.format(new Date());

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function loginMsg(text, kind){
  const m = $('loginMsg'); m.textContent = text;
  m.className = 'msg show ' + (kind || 'ok');
}

/* ---------- Auth flow ---------- */
async function boot(){
  if(!sb){ $('boot').textContent = 'Could not load Supabase. Check your connection and refresh.'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  // React to login link returns + sign in/out.
  sb.auth.onAuthStateChange((_e, s)=>render(s));
  render(session);
}

async function render(session){
  $('boot').hidden = true;
  if(!session){
    $('signout').hidden = true;
    $('board').hidden = true;
    $('login').hidden = false;
    return;
  }
  // Confirm this account is actually an admin (RLS-backed).
  const { data:isAdmin, error } = await sb.rpc('is_admin');
  if(error || !isAdmin){
    $('login').hidden = false; $('board').hidden = true; $('signout').hidden = false;
    loginMsg('This account isn’t set up as an owner. Sign out and use your owner email, or ask to be added.', 'err');
    return;
  }
  $('login').hidden = true;
  $('board').hidden = false;
  $('signout').hidden = false;
  loadJobs();
}

function togglePw(showPw){
  $('linkPane').hidden = showPw;
  $('pwPane').hidden = !showPw;
}

async function sendLink(){
  const email = $('email').value.trim();
  if(!email){ loginMsg('Enter your email first.', 'err'); return; }
  const btn = $('sendLink'); btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({
    email,
    options:{ shouldCreateUser:false, emailRedirectTo: location.origin + location.pathname }
  });
  btn.disabled = false; btn.textContent = 'Email me a sign-in link';
  if(error){ loginMsg(error.message, 'err'); return; }
  loginMsg('Check your email and tap the sign-in link. Open it on this device to finish.', 'ok');
}

async function passwordSignIn(){
  const email = $('email').value.trim();
  const password = $('pw').value;
  if(!email || !password){ loginMsg('Enter your email and password.', 'err'); return; }
  const btn = $('pwSignin'); btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ loginMsg(error.message, 'err'); return; }
}

async function signOut(){ await sb.auth.signOut(); }

function acctMsg(text, kind){
  const m = $('acctMsg'); m.textContent = text; m.className = 'msg show ' + (kind || 'ok');
}
async function changePassword(){
  const pw = $('newpw').value;
  if(pw.length < 8){ acctMsg('Use at least 8 characters.', 'err'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){ acctMsg(error.message, 'err'); return; }
  $('newpw').value = '';
  acctMsg('Password updated. Save it to your iPhone Keychain when prompted.', 'ok');
}

/* ---------- Jobs ---------- */
async function loadJobs(){
  $('jobs').innerHTML = '<p class="empty">Loading jobs…</p>';
  const { data, error } = await sb.from('bookings').select('*').order('slot_start',{ascending:true});
  if(error){ $('jobs').innerHTML = '<p class="empty">Couldn’t load jobs: '+esc(error.message)+'</p>'; return; }
  JOBS = data || [];
  redraw();
}

/* Repaint whichever view is active (plus the shared summary + filter counts). */
function redraw(){
  drawSummary();
  drawFilters();
  if(VIEW==='cal') drawCalendar(); else drawJobs();
}

function setView(v){
  VIEW = v;
  $('vw-list').classList.toggle('on', v==='list');
  $('vw-cal').classList.toggle('on', v==='cal');
  $('filters').hidden = v!=='list';
  $('jobs').hidden = v!=='list';
  $('calendar').hidden = v!=='cal';
  // Only one view renders job cards at a time so element ids stay unique.
  if(v==='list'){ $('calDay').innerHTML=''; drawJobs(); }
  else { $('jobs').innerHTML=''; drawCalendar(); }
}

const FILTERS = [
  { id:'todo',      label:'To do',     match:j => (j.status==='pending'||j.status==='confirmed') },
  { id:'pending',   label:'New',       match:j => j.status==='pending' },
  { id:'confirmed', label:'Confirmed', match:j => j.status==='confirmed' },
  { id:'completed', label:'Done',      match:j => j.status==='completed' },
  { id:'cancelled', label:'Cancelled', match:j => j.status==='cancelled' },
  { id:'all',       label:'All',       match:_ => true },
];

function drawSummary(){
  const tk = todayKey();
  const newCount = JOBS.filter(j=>j.status==='pending').length;
  const upcoming = JOBS.filter(j=>j.status==='confirmed' && dayKey(j.slot_start)>=tk);
  const booked = upcoming.reduce((s,j)=>s+(j.total_usd||0),0);
  $('summary').innerHTML =
    `<div class="stat"><b>${newCount}</b><span>New</span></div>`+
    `<div class="stat"><b>${upcoming.length}</b><span>Upcoming</span></div>`+
    `<div class="stat"><b>$${booked}</b><span>Booked</span></div>`;
}

function drawFilters(){
  $('filters').innerHTML = FILTERS.map(f=>{
    const n = JOBS.filter(f.match).length;
    return `<button class="chip ${FILTER===f.id?'on':''}" onclick="setFilter('${f.id}')">`+
           `${f.label} <i>${n}</i></button>`;
  }).join('');
}

function setFilter(id){ FILTER = id; drawFilters(); drawJobs(); }

function drawJobs(){
  const f = FILTERS.find(x=>x.id===FILTER);
  let list = JOBS.filter(f.match);
  // "To do" reads best soonest-first; history reads best newest-first.
  if(FILTER==='completed' || FILTER==='cancelled') list = list.slice().reverse();

  if(!list.length){ $('jobs').innerHTML = '<p class="empty">Nothing here right now.</p>'; return; }

  const tk = todayKey();
  let html = '', lastDay = '';
  for(const j of list){
    const dk = dayKey(j.slot_start);
    if(dk !== lastDay){
      lastDay = dk;
      let tag = '';
      if(dk===tk) tag = '<em>Today</em>';
      else if(dk < tk) tag = '<em>Past</em>';
      html += `<div class="day-h">${dayFmt.format(new Date(j.slot_start))} ${tag}</div>`;
    }
    html += jobCard(j);
  }
  $('jobs').innerHTML = html;
}

function jobCard(j){
  const addons = (j.addons && j.addons.length) ? `<p class="meta addons">+ ${esc(j.addons.join(', '))}</p>` : '';
  const mapQ = encodeURIComponent(`${j.address}, ${j.town}, Idaho`);
  const phoneDigits = (j.customer_phone||'').replace(/[^\d+]/g,'');
  // The booking form folds a water/power warning into the package text.
  const warn = /Water\/power/i.test(j.package)
    ? `<div class="warn">⚠ ${esc(j.package.split('·').pop().trim())}</div>` : '';
  const pkg = esc(j.package.replace(/·\s*⚠[^·]*$/,'').trim());
  const booked = shortDate.format(new Date(j.created_at));

  let actions = '';
  if(j.status==='pending')
    actions = `<button class="act act-pri" onclick="setStatus('${j.id}','confirmed')">Confirm</button>`+
              `<button class="act act-ghost" onclick="setStatus('${j.id}','cancelled')">Cancel</button>`;
  else if(j.status==='confirmed')
    actions = `<button class="act act-pri" onclick="setStatus('${j.id}','completed')">Mark done</button>`+
              `<button class="act act-ghost" onclick="setStatus('${j.id}','cancelled')">Cancel</button>`;
  else if(j.status==='completed')
    actions = `<button class="act act-ghost" onclick="setStatus('${j.id}','confirmed')">Reopen</button>`;
  else if(j.status==='cancelled')
    actions = `<button class="act act-blue" onclick="setStatus('${j.id}','pending')">Restore</button>`;

  return `<div class="job" id="job-${j.id}">
    <div class="job-top">
      <div class="time">${timeFmt.format(new Date(j.slot_start))}</div>
      <div class="who">
        <b>${esc(j.customer_name)}</b>
        <a class="tel" href="sms:${esc(phoneDigits)}">${esc(j.customer_phone)}</a>
      </div>
      <span class="badge b-${j.status}">${j.status}</span>
    </div>
    <p class="meta">${pkg}</p>
    ${addons}
    <p class="total">$${j.total_usd}</p>
    <a class="addr" href="https://maps.google.com/?q=${mapQ}" target="_blank" rel="noopener">📍 ${esc(j.address)}, ${esc(j.town)}</a>
    ${warn}
    <textarea class="notes" placeholder="Notes — gate code, dog, reminders…"
      data-id="${j.id}" onblur="saveNotes(this)">${esc(j.notes)}</textarea>
    <div class="actions">${actions}</div>
    <div class="meta-foot">Booked ${booked}</div>
  </div>`;
}

/* ---------- Calendar view ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad2 = n => String(n).padStart(2,'0');
/* Compact chip time: "9:00 AM" -> "9am", "1:30 PM" -> "1:30pm". */
const chipTime = iso => timeFmt.format(new Date(iso)).replace(':00','').replace(' AM','am').replace(' PM','pm');

function calInit(){
  if(CAL_REF) return;
  const [y,m] = todayKey().split('-').map(Number);
  CAL_REF = { y, m: m-1 };
  CAL_SEL = todayKey();
}
function calShift(n){
  calInit();
  let m = CAL_REF.m + n, y = CAL_REF.y;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  CAL_REF = { y, m };
  drawCalendar();
}
function calToday(){
  const [y,m] = todayKey().split('-').map(Number);
  CAL_REF = { y, m: m-1 };
  CAL_SEL = todayKey();
  drawCalendar();
}
function calSelect(k){ CAL_SEL = k; drawCalendar(); }

function drawCalendar(){
  calInit();
  const { y, m } = CAL_REF;

  // Jobs grouped by their (Mountain Time) calendar day. JOBS is already time-sorted.
  const byDay = {};
  for(const j of JOBS){ const k = dayKey(j.slot_start); (byDay[k] = byDay[k] || []).push(j); }

  // Month headline: live job count + booked revenue (cancelled excluded).
  const mPrefix = `${y}-${pad2(m+1)}-`;
  const mJobs = JOBS.filter(j => dayKey(j.slot_start).startsWith(mPrefix) && j.status!=='cancelled');
  const mRev = mJobs.reduce((s,j)=>s+(j.total_usd||0),0);
  $('calTitle').textContent = `${MONTHS[m]} ${y}`;
  $('calSub').textContent = mJobs.length ? `${mJobs.length} job${mJobs.length===1?'':'s'} · $${mRev}` : 'No jobs this month';

  const startDow = new Date(y, m, 1).getDay();
  const daysIn = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const tk = todayKey();
  const totalCells = Math.ceil((startDow + daysIn) / 7) * 7;
  const MAXCHIP = 3;

  let cells = '';
  for(let i=0; i<totalCells; i++){
    const dnum = i - startDow + 1;
    if(dnum < 1 || dnum > daysIn){
      const shown = dnum < 1 ? daysInPrev + dnum : dnum - daysIn;
      cells += `<div class="cal-cell out"><span class="cal-num">${shown}</span></div>`;
      continue;
    }
    const k = `${y}-${pad2(m+1)}-${pad2(dnum)}`;
    const js = byDay[k] || [];
    const chips = js.slice(0, MAXCHIP).map(j =>
      `<span class="cal-chip c-${j.status}">${chipTime(j.slot_start)} ${esc((j.customer_name||'').split(' ')[0])}</span>`
    ).join('') + (js.length > MAXCHIP ? `<span class="cal-more">+${js.length-MAXCHIP} more</span>` : '');
    const dots = js.length ? `<span class="cal-dots">${js.map(j=>`<i class="d-${j.status}"></i>`).join('')}</span>` : '';
    cells += `<button class="cal-cell${k===tk?' today':''}${k===CAL_SEL?' sel':''}" onclick="calSelect('${k}')">`+
             `<span class="cal-num">${dnum}</span>${chips}${dots}</button>`;
  }
  $('calGrid').innerHTML = cells;
  drawCalDay(byDay);
}

/* Full job cards (same as the list view) for the selected day, under the grid. */
function drawCalDay(byDay){
  const el = $('calDay');
  if(!CAL_SEL){ el.innerHTML = ''; return; }
  const [yy,mm,dd] = CAL_SEL.split('-').map(Number);
  const label = new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date(yy, mm-1, dd));
  const tag = CAL_SEL===todayKey() ? '<em>Today</em>' : '';
  const js = byDay[CAL_SEL] || [];
  if(!js.length){
    el.innerHTML = `<div class="day-h">${label} ${tag}</div><p class="empty" style="padding:14px 16px">No jobs this day.</p>`;
    return;
  }
  const rev = js.filter(j=>j.status!=='cancelled').reduce((s,j)=>s+(j.total_usd||0),0);
  el.innerHTML = `<div class="day-h">${label} ${tag}<em style="margin-left:auto">$${rev}</em></div>` + js.map(jobCard).join('');
}

async function setStatus(id, status){
  const card = $('job-'+id);
  if(card) card.querySelectorAll('.act').forEach(b=>b.disabled=true);
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if(error){ toast('Update failed: '+error.message); if(card) card.querySelectorAll('.act').forEach(b=>b.disabled=false); return; }
  const j = JOBS.find(x=>x.id===id); if(j) j.status = status;
  toast(status==='confirmed'?'Confirmed ✓':status==='completed'?'Marked done ✓':status==='cancelled'?'Cancelled':'Updated');
  redraw();
}

async function saveNotes(el){
  const id = el.dataset.id;
  const j = JOBS.find(x=>x.id===id);
  const val = el.value;
  if(!j || j.notes === val) return;
  const { error } = await sb.from('bookings').update({ notes: val }).eq('id', id);
  if(error){ toast('Couldn’t save note'); return; }
  j.notes = val; toast('Note saved');
}

boot();
</script>
