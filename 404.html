<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page Not Found | Detail Valley</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2c44">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="alternate icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2c44; --navy-2:#15395a; --blue:#2b6cb0; --blue-dark:#225a93;
    --mist:#eef3f7; --ink:#0f2233; --slate:#3f566a; --copper:#b8632c;
    --copper-2:#974f22; --white:#ffffff; --line:#d9e2ea;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--white);
    background:var(--navy);line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;padding:24px;text-align:center;
  }
  .sheen{position:absolute;inset:0;background:
    radial-gradient(120% 80% at 85% 0%, rgba(43,108,176,.28) 0%, transparent 55%),
    radial-gradient(90% 60% at 0% 100%, rgba(196,120,63,.12) 0%, transparent 60%);
    pointer-events:none}
  main{position:relative;z-index:2;max-width:520px}
  .brand-lockup{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:34px}
  .brand-logo{width:54px;height:54px;border-radius:50%;display:block}
  .brand-word{font-family:'Sora',sans-serif;font-weight:700;font-size:1.35rem;color:var(--white)}
  .brand-lockup a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px}
  .code{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.14em;color:var(--copper);margin-bottom:12px}
  h1{font-family:'Sora',sans-serif;letter-spacing:-.015em;font-size:2.3rem;line-height:1.1;font-weight:700;margin-bottom:16px}
  p.lead{color:#bccbd8;font-size:1.08rem;margin-bottom:30px}
  .btn{
    display:inline-block;background:var(--copper);color:var(--white);border:none;
    font-family:'Sora',sans-serif;font-size:1rem;font-weight:600;letter-spacing:-.01em;
    padding:15px 36px;border-radius:7px;cursor:pointer;text-decoration:none;
    transition:transform .12s ease,background .12s ease;
  }
  .btn:hover{background:var(--copper-2);transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  .links{margin-top:22px;font-size:.94rem}
  .links a{color:#c5d4e1;text-decoration:underline;text-underline-offset:3px}
  .links a:hover{color:var(--white)}
  .links span{color:#8fa5b6;margin:0 8px}
</style>
</head>
<body>

<div class="sheen"></div>
<main>
  <div class="brand-lockup">
    <a href="/"><img src="/logo.svg" alt="Detail Valley logo" class="brand-logo"><span class="brand-word">Detail Valley</span></a>
  </div>
  <p class="code">404</p>
  <h1>This page took a wrong turn.</h1>
  <p class="lead">The page you're looking for doesn't exist or has moved. Your car can still get spotless, though — booking takes under a minute.</p>
  <a class="btn" href="/#packages">Book a detail</a>
  <p class="links">
    <a href="/">Back to home</a><span>·</span><a href="tel:+12083151420">Call or text (208) 315-1420</a>
  </p>
</main>

</body>
</html>
