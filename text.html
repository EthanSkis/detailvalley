<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Owner-only utility page: booking emails link here because some mail apps
     (Zoho, Gmail) strip sms: links but always keep https: ones. The phone
     number and message ride in the #fragment, so they never reach any server
     log. Not linked from the site; keep it out of search results. -->
<meta name="robots" content="noindex,nofollow">
<title>Text customer · Detail Valley</title>
<style>
  /* Site palette: navy text on mist, white card, copper for the one primary action. 4px grid. */
  :root{ --navy:#0b2a45; --ink:#3d566b; --muted:#647788; --mist:#f4f6f8; --line:#dde3e9;
         --copper:#a4521f; --copper-hover:#8c4418; --ease:cubic-bezier(0.22,1,0.36,1) }
  *{ box-sizing:border-box; margin:0 }
  body{ min-height:100svh; display:flex; align-items:center; justify-content:center;
        background:var(--mist); padding:16px;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:var(--ink) }
  .card{ width:100%; max-width:420px; background:#fff; border-radius:16px;
         box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06); overflow:hidden }
  .top{ background:var(--navy); color:#c3d0db; padding:14px 20px;
        font-size:13px; line-height:20px; font-weight:500 }
  .body{ padding:20px }
  h1{ font-size:20px; line-height:28px; font-weight:500; color:var(--navy); margin-bottom:4px }
  .num{ font-size:15px; line-height:20px; font-weight:500; font-variant-numeric:tabular-nums; margin-bottom:12px }
  .msg{ background:var(--mist); border:1px solid var(--line); border-radius:8px;
        padding:11px; font-size:15px; line-height:22px; color:var(--navy); margin-bottom:16px }
  .btn{ display:block; text-align:center; background:var(--copper); color:#fff;
        font-size:16px; line-height:20px; font-weight:500; text-decoration:none; border-radius:8px;
        padding:14px 16px; margin-bottom:8px; transition:background-color 150ms var(--ease) }
  .ghost{ display:block; width:100%; text-align:center; background:#fff; color:var(--navy);
          font:inherit; font-size:14px; line-height:20px; font-weight:500; border:1px solid var(--line);
          border-radius:8px; padding:11px; cursor:pointer; transition:background-color 150ms var(--ease) }
  .note{ font-size:12px; line-height:16px; color:var(--muted); text-align:center; margin-top:12px }
  .note:empty{ display:none }
  .btn:focus-visible,.ghost:focus-visible{ outline:2px solid var(--copper); outline-offset:2px }
  @media(hover:hover){
    .btn:hover{ background:var(--copper-hover) }
    .ghost:hover{ background:var(--mist) }
  }
  @media(prefers-reduced-motion:reduce){ *{ transition:none!important } }
</style>
</head>
<body>
<main class="card">
  <div class="top">Detail Valley &middot; Confirm by text</div>
  <div class="body">
    <h1>Text your customer</h1>
    <p class="num" id="num"></p>
    <div class="msg" id="msg"></div>
    <a class="btn" id="open" href="#">Open in Messages</a>
    <button class="ghost" id="copy" type="button">Copy message</button>
    <p class="note" id="note">If Messages does not open by itself, tap the button</p>
  </div>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const p = new URLSearchParams(location.hash.slice(1));
  const digits = (p.get('to')||'').replace(/[^0-9+]/g,'');
  const body = (p.get('body')||'').trim();

  if(!digits){
    $('num').textContent = '';
    $('msg').textContent = 'This link is missing its booking details. Open it again from the booking email.';
    $('open').style.display = 'none';
    $('copy').style.display = 'none';
    $('note').textContent = '';
    return;
  }

  const d = digits.replace(/^\+?1/,'');
  $('num').textContent = d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : digits;
  $('msg').textContent = body;

  /* "?&body=" is deliberate — iOS Messages wants "&body=", Android wants
     "?body="; the combined form fills the draft on both. */
  const href = `sms:${digits}?&body=${encodeURIComponent(body)}`;
  $('open').href = href;

  $('copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(body); $('copy').textContent = 'Copied'; }
    catch(e){ $('copy').textContent = 'Press and hold the message to copy'; }
    setTimeout(()=>{ $('copy').textContent = 'Copy message'; }, 2000);
  };

  /* Auto-open after the page paints. Some browsers block app links that the
     user didn't tap — the big button is the always-works path. */
  setTimeout(()=>{ location.href = href; }, 350);
})();
</script>
</body>
</html>
