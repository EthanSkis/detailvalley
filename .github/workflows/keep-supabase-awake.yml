# Keeps the booking calendar's Supabase project from being auto-paused.
#
# Supabase pauses free-tier projects after ~7 days with no API traffic. When
# that happens every request from the site errors and the booking flow falls
# back to "Couldn't load available times. Call or text …" instead of the
# calendar. This job makes one anonymous, read-only call (the same
# `taken_slots` RPC the public calendar uses — no PII) every couple of days so
# the project always counts as active.
#
# The key below is the site's public publishable key, already shipped in
# index.html, so there is nothing secret here.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */2 * *'   # every other day, 09:17 UTC (≈ 3:17 AM Mountain)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call taken_slots RPC
        env:
          SUPABASE_URL: https://utybbdrthxgsijplowup.supabase.co
          SUPABASE_KEY: sb_publishable_48352eB1w0mLVwvLm3gXUg_BpGKN67o
        run: |
          set -euo pipefail
          from="$(date -u +%Y-%m-%dT00:00:00Z)"
          to="$(date -u -d '+30 days' +%Y-%m-%dT00:00:00Z)"
          code="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/taken_slots" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"p_from\":\"$from\",\"p_to\":\"$to\"}")"
          echo "HTTP $code"; cat /tmp/body; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase responded $code — the project may be paused. Restore it at https://supabase.com/dashboard/project/utybbdrthxgsijplowup"
            exit 1
          fi
