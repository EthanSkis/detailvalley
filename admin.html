/* ---------- Edit a booking ----------
   One form for any job: when, what, the price, who, where, notes. On a computer
   it takes over the job panel; on a phone it opens as a full-screen sheet.
   Package, vehicle and add-ons come from the shared price list (dv-pricing.js),
   so changing any of them refigures the total and the hours the same way the
   booking flow would. Both can still be typed over for a custom quote. */
const PRICING = window.DV_PRICING || { packages:[], sizes:[], addons:[] };
const TOWNS = ['McCall','Cascade','Donnelly','Other'];
let EDIT = null;          // id of the booking being edited
let EDIT_DIRTY = false;   // something was typed since the form opened
const tzFmt = new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
/* A Mountain-Time wall clock ('YYYY-MM-DD', 'HH:MM') -> the real instant, DST included. */
function boiseISO(date, time){
  const [y,m,d] = date.split('-').map(Number), [hh,mm] = time.split(':').map(Number);
  const guess = Date.UTC(y, m-1, d, hh, mm);
  const p = {}; for(const x of tzFmt.formatToParts(new Date(guess))) p[x.type] = x.value;
  const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second);
  return new Date(guess - (asUTC - guess)).toISOString();
}
const clock24 = iso => { const h = hourOf(new Date(iso)); return pad2(Math.floor(h)) + ':' + pad2(Math.round((h % 1) * 60)); };
const waterOf = j => { const w = warnText(j); return !w ? 'yes' : /NOT/i.test(w) ? 'no' : 'unsure'; };
const optHtml = (value, label, on) => `<option value="${esc(value)}"${on?' selected':''}>${esc(label)}</option>`;
const editPkg = () => PRICING.packages.find(p=>p.id===$('e-pkg').value) || null;
const editSize = () => PRICING.sizes.find(s=>s.id===$('e-size').value) || null;
const editChecked = () => [...document.querySelectorAll('#e-addons input:checked:not(:disabled)')].map(i=>i.value);

/* Add-on rows for the chosen package: bundled ones show as included, ones that
   do not apply are left out, and any name not on the price list is kept as is. */
function addonsHtml(pkg, names){
  const rows = PRICING.addons.filter(a => !(pkg && pkg.excludes && pkg.excludes.includes(a.id))).map(a=>{
    const inc = !!(pkg && pkg.includes && pkg.includes.includes(a.id));
    return `<label class="ef-check${inc?' inc':''}"><input type="checkbox" value="${esc(a.name)}"${inc?' checked disabled':names.includes(a.name)?' checked':''} onchange="editReprice()">`+
      `<span>${esc(a.name.split(' — ')[0])}</span><em>${inc?'Included':'+'+money(a.price)}</em></label>`;
  });
  const extra = names.filter(n => !PRICING.addons.some(a=>a.name===n)).map(n=>
    `<label class="ef-check"><input type="checkbox" value="${esc(n)}" checked><span>${esc(n)}</span><em></em></label>`);
  return rows.concat(extra).join('') || '<p class="ef-hint">No add-ons on the price list</p>';
}
/* What the price list says for the form as it stands, or null for a package it does not know. */
function editQuote(){
  const pkg = editPkg(); if(!pkg) return null;
  const sz = editSize(), picked = editChecked();
  const ads = PRICING.addons.filter(a => picked.includes(a.name));
  return { total: pkg.price + (sz ? sz.price : 0) + ads.reduce((s,a)=>s+a.price,0),
           mins:  pkg.min   + (sz ? sz.min   : 0) + ads.reduce((s,a)=>s+a.min,0) };
}
function editHint(){
  const q = editQuote(), el = $('e-hint');
  if(!q){ el.textContent = ''; return; }
  const same = +$('e-total').value === q.total && Math.round(+$('e-hours').value * 60) === q.mins;
  el.innerHTML = `Price list: ${money(q.total)} · ${q.mins / 60} hrs` + (same ? '' : ` <button type="button" class="ef-use" onclick="editUseQuote()">Use these</button>`);
}
function editUseQuote(){
  const q = editQuote(); if(!q) return;
  $('e-total').value = q.total; $('e-hours').value = q.mins / 60; EDIT_DIRTY = true; editHint();
}
/* Package, vehicle or an add-on changed: redo the add-on rows and refigure the price and the time. */
function editReprice(packageChanged){
  if(packageChanged) $('e-addons').innerHTML = addonsHtml(editPkg(), editChecked());
  editUseQuote(); editHint();
}

function editFormHtml(j){
  const pkg = PRICING.packages.find(p=>p.name===pkgName(j)), sz = PRICING.sizes.find(s=>s.name===pkgSize(j));
  const water = waterOf(j), names = j.addons || [];
  const pkgOpts = (pkg ? '' : optHtml('', pkgName(j) || 'Not set', true)) + PRICING.packages.map(p=>optHtml(p.id, `${p.name} · ${money(p.price)}`, pkg && p.id===pkg.id)).join('');
  const sizeOpts = (sz ? '' : optHtml('', pkgSize(j) || 'Not set', true)) + PRICING.sizes.map(s=>optHtml(s.id, s.name, sz && s.id===sz.id)).join('');
  const towns = TOWNS.includes(j.town) || !j.town ? TOWNS : [j.town].concat(TOWNS);
  return `<form class="ef" id="editForm" data-id="${j.id}" novalidate oninput="EDIT_DIRTY=true" onsubmit="saveEdit(event)" onkeydown="if(event.key==='Escape')closeEdit()">
    <h2 class="ef-title">Edit booking</h2>
    <div class="ef-row">
      <div><label for="e-date">Date</label><input id="e-date" type="date" value="${dayKey(j.slot_start)}" required></div>
      <div><label for="e-time">Arrival time</label><input id="e-time" type="time" step="900" value="${clock24(j.slot_start)}" required></div>
    </div>
    <div><label for="e-pkg">Package</label><select id="e-pkg" onchange="editReprice(true)">${pkgOpts}</select></div>
    <div><label for="e-size">Vehicle</label><select id="e-size" onchange="editReprice()">${sizeOpts}</select></div>
    <fieldset><legend>Add-ons</legend><div class="ef-checks" id="e-addons">${addonsHtml(pkg, names)}</div></fieldset>
    <div><label for="e-water">Water tap and power outlet</label><select id="e-water">
      ${optHtml('yes','Both on site',water==='yes')}${optHtml('unsure','Not sure yet',water==='unsure')}${optHtml('no','Not available',water==='no')}</select></div>
    <div class="ef-group"><div class="ef-row">
      <div><label for="e-total">Total ($)</label><input id="e-total" type="number" inputmode="numeric" min="0" max="100000" step="1" value="${j.total_usd||0}" oninput="editHint()"></div>
      <div><label for="e-hours">Hours on the job</label><input id="e-hours" type="number" inputmode="decimal" min="0.5" max="10" step="0.25" value="${jobMins(j)/60}" oninput="editHint()"></div>
    </div>
    <p class="ef-hint" id="e-hint"></p></div>
    <div class="ef-row">
      <div><label for="e-name">Customer</label><input id="e-name" value="${esc(j.customer_name)}" autocomplete="off" maxlength="120"></div>
      <div><label for="e-phone">Phone</label><input id="e-phone" type="tel" inputmode="tel" value="${esc(j.customer_phone)}" autocomplete="off" maxlength="40"></div>
    </div>
    <div class="ef-row wide">
      <div><label for="e-address">Address</label><input id="e-address" value="${esc(j.address)}" autocomplete="off" maxlength="200"></div>
      <div><label for="e-town">Town</label><select id="e-town">${towns.map(t=>optHtml(t, t, t===j.town)).join('')}</select></div>
    </div>
    <div><label for="e-notes">Notes</label><textarea class="notes" id="e-notes" placeholder="Gate code, dog, reminders">${esc(j.notes)}</textarea></div>
    <div class="msg" id="editMsg" role="alert"></div>
    <div class="actions">
      <button class="act act-pri" id="editSave">Save changes</button>
      <button type="button" class="act act-ghost" onclick="closeEdit()">Discard</button>
    </div>
  </form>`;
}

function startEdit(id){
  if(EDIT && EDIT!==id && !closeEdit()) return;
  const j = JOBS.find(x=>x.id===id); if(!j) return;
  EDIT = id; EDIT_DIRTY = false;
  if(deskOn()){ DSEL = id; redraw(); }
  else { $('sheet').innerHTML = editFormHtml(j); $('sheet').hidden = false; document.body.classList.add('sheet-open'); $('sheet').scrollTop = 0; }
  editHint();
  $('e-date').focus({preventScroll:true});
}
/* Leave the editor. Returns false if there were unsaved changes and the owner chose to keep editing. */
function closeEdit(saved){
  if(!EDIT) return true;
  if(!saved && EDIT_DIRTY && !confirm('Discard your changes to this booking?')) return false;
  EDIT = null; EDIT_DIRTY = false;
  $('sheet').hidden = true; $('sheet').innerHTML = ''; document.body.classList.remove('sheet-open');
  redraw();
  return true;
}
function editMsg(text){ const m = $('editMsg'); m.textContent = text; m.className = 'msg show err'; m.scrollIntoView({block:'nearest'}); }

async function saveEdit(ev){
  ev.preventDefault();
  const j = JOBS.find(x=>x.id===EDIT); if(!j) return;
  const v = id => $(id).value.trim();
  const name = v('e-name'), phone = v('e-phone'), date = v('e-date'), time = v('e-time');
  const total = Number(v('e-total')), mins = Math.round(Number(v('e-hours')) * 60);
  // The same limits the database enforces, said in plain words before it has to.
  if(!date || !time) return editMsg('Pick a date and an arrival time');
  if(!name) return editMsg('Enter the customer’s name');
  if(phone.length < 7) return editMsg('Enter a phone number');
  if(!Number.isInteger(total) || total < 0 || total > 100000) return editMsg('Total must be a whole dollar amount');
  if(!(mins >= 30 && mins <= 600)) return editMsg('Hours on the job must be between 0.5 and 10');

  // Rebuilt in the same shape the booking flow stores: "Package · Vehicle · ⚠ Water/power: …"
  const pkg = editPkg(), sz = editSize(), water = v('e-water');
  const parts = [pkg ? pkg.name : pkgName(j), sz ? sz.name : pkgSize(j)].filter(Boolean);
  if(water !== 'yes') parts.push(`⚠ Water/power: ${water==='no' ? 'NOT available' : 'unsure'}`);
  const next = {
    slot_start: boiseISO(date, time), duration_min: mins, package: parts.join(' · '), addons: editChecked(),
    total_usd: total, customer_name: name, customer_phone: phone, address: v('e-address'), town: v('e-town'), notes: $('e-notes').value
  };
  if(next.package.length > 140) return editMsg('Package and vehicle are too long to save');
  // Send only what changed.
  const same = (a, b) => Array.isArray(a) ? JSON.stringify(a) === JSON.stringify(b || []) : a === (b == null ? '' : b);
  const patch = {};
  for(const k in next){
    const before = k === 'slot_start' ? new Date(j.slot_start).toISOString() : k === 'duration_min' ? jobMins(j) : j[k];
    if(!same(next[k], before)) patch[k] = next[k];
  }
  if(!Object.keys(patch).length){ closeEdit(true); toast('Nothing changed'); return; }

  const btn = $('editSave'); btn.disabled = true; btn.textContent = 'Saving…';
  const { data, error } = await sb.from('bookings').update(patch).eq('id', j.id).select('id');
  btn.disabled = false; btn.textContent = 'Save changes';
  if(error){
    return editMsg(error.code === '23P01' ? 'That time overlaps another job. Pick another day or time, or cancel the other job first.'
      : 'Couldn’t save: ' + error.message);
  }
  if(!data || !data.length) return editMsg('Nothing was saved. Sign out, sign back in and try again.');
  Object.assign(j, patch);
  JOBS.sort((a,b)=> new Date(a.slot_start) - new Date(b.slot_start));
  if(deskOn()) dReveal(dayKey(j.slot_start));   // follow the job if it moved
  closeEdit(true);
  toast('Saved');
}

boot();
</script>
</body>
</html>
